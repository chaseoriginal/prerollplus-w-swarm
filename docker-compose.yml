services:
  prerollplus:
    image: chadwpalm/prerollplus:develop@sha256:4d2cd5abd2eabf6b3b2739ce5eb08db3c6198602e83cf6bcdef200133908a000@sha256:4d2cd5abd2eabf6b3b2739ce5eb08db3c6198602e83cf6bcdef200133908a000
    container_name: prerollplus-w-swarm_prerollplus
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    ports:
    - target: 4949
      published: 4950
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.prerollplus == true
      restart_policy:
        condition: on-failure
    volumes:
    - prerollplus-w-swarm_prerollplus_config:/config
    - /media/Multimedia/Pre-Rolls/:/prerolls
volumes:
  prerollplus-w-swarm_prerollplus_config:
    name: prerollplus-w-swarm_prerollplus_config
