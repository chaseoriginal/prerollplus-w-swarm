services:
  prerollplus:
    image: ${image}
    container_name: ${container_name}
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    ports:
    - target: 4949
      published: 4950
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.labels.deployment.target.prerollplus == true
      restart_policy:
        condition: on-failure
    volumes:
    - prerollplus-w-swarm_prerollplus_config:/config
    - /media/Multimedia/Pre-Rolls/:/prerolls
volumes:
  prerollplus-w-swarm_prerollplus_config:
    name: prerollplus-w-swarm_prerollplus_config
